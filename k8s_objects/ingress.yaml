apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing01
spec:
  ingressClassName: ingress-nginx
  rules:
  - host: arch.homework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service01 
            port:
              number: 80